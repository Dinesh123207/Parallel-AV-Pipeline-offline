[package]
name = "audit0"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.3.0", features = [] }

[dependencies]
tauri = { version = "1.3.0", features = [ "path-all", "shell-open", "dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
notify = "7.0"
log = "^0.4"
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1", features = ["colored"] }
futures = "0.3"
symlink = "0.1"
chrono = "0.4"
regex = "1.11.1"
uuid = "1.0"
winapi = { version = "0.3", features = ["winuser"] }
tokio-tungstenite = "0.17"
tungstenite = "0.17"
futures-util = "0.3"
once_cell = "1.10.0"
reqwest = {version = "0.12.9", features = ["rustls-tls", "blocking"] }
lazy_static = "1.4"
warp = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "folder_monitor"
path = "src/folder_monitor/main.rs"
